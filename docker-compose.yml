version: "3.9"

services:
  web:
    container_name: tabletop_rpg_next
    image: gustecdev/tabletop-rpg-combat-assistant:1.0.0
    # Para desenvolvimento local, você pode usar:
    # build: .

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - app_network

networks:
  app_network:
    driver: bridge
